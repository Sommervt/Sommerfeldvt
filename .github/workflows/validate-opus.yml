name: 音楽アップロードの処理

on:
  pull_request:
    paths:
      - "music/incoming/**"
  push:
    branches:
      - main
    paths:
      - "music/incoming/**"

permissions:
  contents: read

jobs:
  validate-upload:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FFmpegをインストール
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Opus音源とジャケットの組み合わせを検証
        run: python3 scripts/process_music_uploads.py --check

  process-upload:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: FFmpegをインストール
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: ファイルを整理し、MP3バックアップとカタログを作成
        run: python3 scripts/process_music_uploads.py

      - name: 処理した音楽ファイルをコミットして公開
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A music/incoming music/tracks music/covers music/backups music/catalog.json

          if git diff --cached --quiet; then
            echo "コミットする音楽ファイルの変更はありません。"
            exit 0
          fi

          git commit -m "音楽アップロードを処理"
          git push origin "HEAD:${GITHUB_REF_NAME}"
